<!doctype html>
<html lang="{{ lang or 'en' }}">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Noto Sans Devanagari"; src: url("fonts/NotoSansDevanagari-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Noto Serif Devanagari"; src: url("fonts/NotoSerifDevanagari-Regular.ttf"); font-weight: 400; }
  @page { size: A4; margin: 18mm 16mm 20mm 16mm;
    @bottom-left { content: "{{ school_name }} · Generated by ACHARYA, approved by a teacher"; font: 8pt "Helvetica Neue", Arial, sans-serif; color: #666; }
    @bottom-right { content: "Page " counter(page) " of " counter(pages); font: 8pt "Helvetica Neue", Arial, sans-serif; color: #666; } }
  * { box-sizing: border-box; }
  body { font: 10.5pt/1.5 "Helvetica Neue", Arial, "Noto Sans Devanagari", sans-serif; }
  html[lang="hi"] body, html[lang="hi"] h1, html[lang="hi"] h2, html[lang="hi"] h3 { font-family: "Noto Sans Devanagari", "Noto Serif Devanagari", sans-serif; color: #1b1d21; }
  h1, h2, h3 { font-family: Georgia, "Times New Roman", "Noto Serif Devanagari", serif; font-weight: 500; letter-spacing: -0.01em; }
  h1 { font-size: 22pt; margin: 0 0 2mm; }
  h2 { font-size: 14pt; margin: 8mm 0 2mm; color: #560f12; }
  h3 { font-size: 11.5pt; margin: 5mm 0 1.5mm; }
  .masthead { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1.5pt solid #931b20; padding-bottom: 3mm; margin-bottom: 6mm; }
  .masthead .school { font-size: 9pt; color: #555; }
  .brand { font-family: Georgia, serif; color: #931b20; font-size: 12pt; }
  .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm 6mm; font-size: 9.5pt; margin-bottom: 4mm; }
  .meta b { display: block; font-size: 8pt; color: #666; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
  th { text-align: left; font-weight: 600; border-bottom: 1pt solid #931b20; padding: 2mm 1.5mm; }
  td { border-bottom: 0.5pt solid #ddd; padding: 2mm 1.5mm; vertical-align: top; }
  .chip { display: inline-block; font-family: "Courier New", monospace; font-size: 8.5pt; border: 0.6pt solid #931b20; color: #931b20; border-radius: 10pt; padding: 0 2mm; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .callout { background: #fbeced; border-left: 2pt solid #931b20; padding: 3mm 4mm; margin: 4mm 0; font-size: 9.5pt; }
  .muted { color: #666; }
  .sig { margin-top: 12mm; display: grid; grid-template-columns: 1fr 1fr; gap: 10mm; font-size: 9pt; }
  .sig div { border-top: 0.6pt solid #999; padding-top: 2mm; }
  .page-break { page-break-before: always; }
</style>
</head>
<body>
<div class="masthead">
  <div>
    <div class="school">{{ school_name }}</div>
    <h1>{{ title }}</h1>
  </div>
  <div class="brand">ACHARYA</div>
</div>
{% block body %}{% endblock %}
</body>
</html>
